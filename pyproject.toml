[project]
name = "reserve_model"
version = "1.0.0"
description = "Latent reserve model linking mean arterial pressure to EEG alpha power under general anesthesia."
readme = "README.md"
authors = [{ name = "Emilia Turc", email = "emilia.turc@etu.u-paris.fr" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=19.0",  # reading the processed parquet signals (scripts/prepare_inputs.py)
]

[project.optional-dependencies]
# statistics and plotting used to produce the figures and tables of the manuscript
analysis = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tableone>=0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reserve_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# Exact versions of the environment in which the article's results were computed.
constraint-dependencies = [
    "numpy==2.2.3",
    "scipy==1.15.2",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.6",
    "tableone==0.9.6",
]
